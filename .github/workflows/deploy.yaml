name: Deploy Next.js to S3

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js app
        run: pnpm build
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          DOMAIN: ${{ vars.DOMAIN }}
          NEXT_PUBLIC_APP_NAME: ${{ vars.APP_NAME }}
          NEXT_PUBLIC_DOMAIN: ${{ vars.DOMAIN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.LANDING_PAGE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Sync static export to S3
        run: |
          aws s3 sync out "s3://${{ vars.LANDING_PAGE_S3_BUCKET }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.LANDING_PAGE_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
